<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 GitHub 新星速报</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .landing-header {
            text-align: center;
            padding: 80px 20px;
            border-bottom: 1px solid var(--border);
        }
        .landing-header h1 {
            font-size: 36px;
            margin-bottom: 12px;
        }
        .landing-header .subtitle {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 24px;
        }
        .landing-header .cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent);
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: background 0.15s;
        }
        .landing-header .cta:hover { background: var(--accent-hover); }
        
        .report-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .report-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.15s;
        }
        .report-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .report-card h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .report-card .date {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 16px;
        }
        .report-card .stats {
            display: flex;
            gap: 16px;
            font-size: 13px;
        }
        .report-card .stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .report-card .projects {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .report-card .project-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .report-card .project-item .name {
            color: var(--text);
        }
    </style>
</head>
<body>
    <button class="menu-toggle" onclick="toggleSidebar()">☰ 历史</button>
    
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span>🌟</span> Rising Stars
                </div>
            </div>
            <div class="nav-section">
                <h3>历史报告</h3>
                <ul class="nav-list" id="nav-list"></ul>
            </div>
        </nav>
        
        <!-- Main Content -->
        <main class="main-content" style="padding: 0;">
            <div class="landing-header">
                <h1>🌟 GitHub 新星速报</h1>
                <p class="subtitle">每日发现高潜力开源项目 · 凌晨 2:00 自动更新</p>
                <a href="#latest" class="cta" id="latest-link">📊 查看最新报告</a>
            </div>
            
            <div class="report-grid" id="report-grid">
                <!-- 动态填充 -->
            </div>
            
            <footer style="border-top: 1px solid var(--border); padding: 40px; text-align: center; color: var(--text-muted); font-size: 13px;">
                <p>🌟 GitHub 新星速报 | 由 Neo 自动生成</p>
                <p>新星指数 = 周增长 / √总Star</p>
            </footer>
        </main>
    </div>
    
    <script>
        async function loadReports() {
            try {
                const resp = await fetch('reports/manifest.json');
                const data = await resp.json();
                
                // 导航栏
                const navList = document.getElementById('nav-list');
                navList.innerHTML = data.reports.map((r, i) => `
                    <li class="nav-item">
                        <a href="reports/${r.date}/index.html" class="nav-link">
                            📊 ${r.date}
                            <span class="count">${r.projectCount}</span>
                        </a>
                    </li>
                `).join('');
                
                // 报告卡片
                const grid = document.getElementById('report-grid');
                grid.innerHTML = data.reports.map(r => `
                    <a href="reports/${r.date}/index.html" class="report-card">
                        <h3>📊 ${r.date}</h3>
                        <p class="date">${formatDate(r.date)}</p>
                        <div class="stats">
                            <span class="stat">⭐ ${r.totalStars} Stars</span>
                            <span class="stat">📈 最高指数 ${r.topIndex}</span>
                        </div>
                        <div class="projects">
                            ${r.projects.slice(0, 3).map(p => `
                                <div class="project-item">
                                    <span>🔹</span>
                                    <span class="name">${p.name.split('/')[1]}</span>
                                    <span>⭐${p.stars}</span>
                                </div>
                            `).join('')}
                        </div>
                    </a>
                `).join('');
                
                // 更新最新报告链接
                if (data.reports.length > 0) {
                    document.getElementById('latest-link').href = `reports/${data.reports[0].date}/index.html`;
                }
            } catch (e) {
                console.error(e);
                document.getElementById('report-grid').innerHTML = '<p style="color: var(--text-muted); padding: 20px;">暂无报告</p>';
            }
        }
        
        function formatDate(dateStr) {
            const d = new Date(dateStr);
            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · ${weekdays[d.getDay()]}`;
        }
        
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }
        
        loadReports();
    </script>
</body>
</html>
